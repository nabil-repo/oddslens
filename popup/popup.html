<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OddsLens — DreamDEX Live Odds</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand-row">
        <div class="brand-title">
          <img src="../icons/icon48.png" alt="OddsLens" class="brand-logo">
          <div>
            <h1>OddsLens</h1>
            <span class="brand-sub">DreamDEX × Somnia</span>
          </div>
        </div>
        <div class="status-pill" id="ws-status">
          <span class="status-dot"></span>
          <span class="status-text">Connected</span>
        </div>
      </div>
      <div class="network-bar">
        <span class="network-badge" id="network-badge">Shannon Testnet 50312</span>
        <span class="block-number" id="block-number">Block #...</span>
      </div>
    </header>

    <!-- Quick Settings Toggles -->
    <section class="controls-card">
      <div class="toggle-row">
        <span class="toggle-label">Curated Auto-Detect</span>
        <label class="switch">
          <input type="checkbox" id="toggle-autodetect" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Live Simulation Volatility</span>
        <label class="switch">
          <input type="checkbox" id="toggle-simulation" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Odds Movement Audio Chimes</span>
        <label class="switch">
          <input type="checkbox" id="toggle-audio" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Keyword Tester -->
    <section class="tester-card">
      <label class="section-title" for="tester-input">Quick Keyword Match Tester</label>
      <div class="tester-input-wrap">
        <input type="text" id="tester-input" placeholder="Type topic (e.g. Bitcoin, Somnia, Madrid)...">
        <button id="btn-test-match">Test</button>
      </div>
      <div id="test-result" class="test-result hidden">
        <div class="result-title" id="result-title"></div>
        <div class="result-meta">
          <span class="confidence-badge" id="result-conf"></span>
          <button class="btn-preview-widget" id="btn-preview-widget">Launch on Tab ↗</button>
        </div>
      </div>
    </section>

    <!-- Active Markets Section -->
    <section class="markets-card">
      <div class="section-header">
        <span class="section-title">Tracked Event Contracts</span>
        <span class="market-count" id="market-count">4 Markets</span>
      </div>
      <div class="markets-list" id="markets-list">
        <!-- Injected dynamically -->
      </div>
    </section>

    <footer class="popup-footer">
      <button class="footer-btn" id="btn-open-options">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Options & Mappings</span>
      </button>
      <button class="footer-btn secondary" id="btn-open-demo">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Demo Showcase</span>
      </button>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
